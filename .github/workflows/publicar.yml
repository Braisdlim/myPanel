# Publica Pauta en GitHub Pages (D-053): https://braisdlim.github.io/myPanel/
# En cada push a la rama principal: pruebas unitarias y, si pasan, compilación y despliegue.
# Basado en la guía oficial de Astro para GitHub Pages (consultada el 22-10-2026).
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/confident-bohr-h7z5mh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro push, se espera al que está en marcha
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  compilar:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar, compilar y subir la web
        uses: withastro/action@v6
        with:
          path: app
          node-version: 24
        env:
          PAUTA_SITE: https://braisdlim.github.io
          PAUTA_BASE: /myPanel

  desplegar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
